<!DOCTYPE html>

<body>

        <h2>CD list</h2>

            <tr>

            </tr>
            <tr>
                <td>Paddlefoot - The first CD</td>

                <td>Paddlefoot - The second CD</td>

                    <form action="cart" method="post">

                    </form>
                </td>
            </tr>
            <tr>
                <td>Joe Rut - Genuine Wood Grained Finish</td>

                <td>
                    <form action="cart" method="post">
                        <input type="submit" value="Add To Cart">
